<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10110f" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Brak połączenia — System Formy</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10110f;color:#f3f5f1}
    *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#20271a 0,transparent 55%),#10110f}
    main{width:min(100%,440px);padding:32px;border:1px solid #333a2b;border-radius:24px;background:#151812;text-align:center;box-shadow:0 24px 70px #0006}
    img{width:64px;height:64px;object-fit:contain;margin-bottom:18px}p.eyebrow{color:#d9ff43;font-size:11px;font-weight:800;letter-spacing:.16em}h1{font-size:clamp(26px,7vw,36px);line-height:1.1;margin:14px 0}p{color:#b9c1b2;line-height:1.6}button{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:13px;background:#d9ff43;color:#15190d;font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/pwa-192.png" alt="" />
    <p class="eyebrow">SYSTEM FORMY</p>
    <h1>Wygląda na to, że jesteś offline.</h1>
    <p>Połącz się z internetem, aby zsynchronizować konto, otworzyć plan i zapisać trening. Dane konta nie są przechowywane w trybie offline przez tę aplikację.</p>
    <button type="button" onclick="window.location.reload()">Spróbuj ponownie</button>
  </main>
</body>
</html>
